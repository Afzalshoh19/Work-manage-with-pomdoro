<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<title>Tarix — Neumorphism</title>
<script src="9e9e6f99-e784-4145-ab61-c4b3fbdf7b0d"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>/* shriftlar olib tashlandi */</style>
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#E4E8EF;color:#2E3647}
a{color:#B8372B}a:hover{color:#8A2419}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; background: #E4E8EF; display: flex; flex-direction: column; gap: 26px; padding: 28px 44px 44px; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; height: 64px">
<div style="font-weight: 800; font-size: 20px">Pomodoro</div>
<nav style="display: flex; gap: 6px; padding: 6px; border-radius: 20px; box-shadow: inset 5px 5px 10px #C2C8D2, inset -5px -5px 10px #FFFFFF">
<a href="Neu.dc.html" style="padding: 11px 22px; border-radius: 15px; color: #56607A; font-weight: 700; font-size: 14px; text-decoration: none">Bugun</a>
<a href="Stat-Neu.dc.html" style="padding: 11px 22px; border-radius: 15px; color: #56607A; font-weight: 700; font-size: 14px; text-decoration: none">Statistika</a>
<a href="Rep-Neu.dc.html" style="padding: 11px 22px; border-radius: 15px; color: #56607A; font-weight: 700; font-size: 14px; text-decoration: none">Hisobot</a>
<a href="#" style="padding: 11px 22px; border-radius: 15px; background: #E4E8EF; color: #B8372B; font-weight: 800; font-size: 14px; text-decoration: none; box-shadow: 4px 4px 8px #C2C8D2, -4px -4px 8px #FFFFFF">Tarix</a>
</nav>
<div style="font-weight: 700; font-size: 14px">Foydalanuvchi I.</div>
</header>

<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; align-items: flex-end; gap: 20px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800">Tarix</h1>
<div style="display: flex; gap: 12px">
<button style="height: 42px; padding: 0 16px; border: 0; border-radius: 14px; background: #E4E8EF; color: #3E4760; font-weight: 700; font-size: 13px; box-shadow: 4px 4px 8px #C2C8D2, -4px -4px 8px #FFFFFF">↓ JSON</button>
<button style="height: 42px; padding: 0 16px; border: 0; border-radius: 14px; background: #E4E8EF; color: #3E4760; font-weight: 700; font-size: 13px; box-shadow: 4px 4px 8px #C2C8D2, -4px -4px 8px #FFFFFF">↓ CSV (Excel)</button>
<button style="height: 42px; padding: 0 16px; border: 0; border-radius: 14px; background: #E4E8EF; color: #3E4760; font-weight: 700; font-size: 13px; box-shadow: 4px 4px 8px #C2C8D2, -4px -4px 8px #FFFFFF">↑ Import</button>
</div>
</div>
<div style="display: flex; gap: 14px; align-items: center">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #56607A">Dan<input value="28.08.2026" style="height: 46px; width: 140px; padding: 0 16px; box-sizing: border-box; border: 0; border-radius: 16px; background: #E4E8EF; color: #2E3647; font-size: 14px; font-weight: 700; box-shadow: inset 4px 4px 8px #C2C8D2, inset -4px -4px 8px #FFFFFF"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #56607A">Gacha<input value="26.09.2026" style="height: 46px; width: 140px; padding: 0 16px; box-sizing: border-box; border: 0; border-radius: 16px; background: #E4E8EF; color: #2E3647; font-size: 14px; font-weight: 700; box-shadow: inset 4px 4px 8px #C2C8D2, inset -4px -4px 8px #FFFFFF"></label>
<button style="height: 46px; padding: 0 22px; border: 0; border-radius: 16px; background: {{accent}}; color: #fff; font-weight: 800; font-size: 14px; box-shadow: 6px 6px 12px #C2C8D2, -6px -6px 12px #FFFFFF">Ko'rish</button>
</div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px">
<div style="padding: 18px 22px; border-radius: 24px; box-shadow: inset 6px 6px 12px #C2C8D2, inset -6px -6px 12px #FFFFFF">
<div style="display: grid; grid-template-columns: 220px 200px 1fr 150px 120px 90px; align-items: center; gap: 16px; font-size: 14px; font-weight: 600">
<span style="font-weight: 800; font-size: 15px">25-sentabr, Juma</span>
<div style="height: 12px; padding: 2px; box-sizing: border-box; border-radius: 8px; box-shadow: inset 2px 2px 4px #C2C8D2, inset -2px -2px 4px #FFFFFF"><div style="width: 73%; height: 100%; border-radius: 6px; background: {{accent}}"></div></div>
<span><b>11</b> pomodoro</span><span>Fokus <b>4s 35d</b></span><span style="color: #56607A">Tanaffus 5d</span><span style="color: #56607A">0/3 vazifa</span>
</div>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{sub}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: 14px; background: #E4E8EF; box-shadow: 3px 3px 6px #C2C8D2, -3px -3px 6px #FFFFFF; font-size: 13px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 2px 2px 3px #C2C8D2, inset -2px -2px 3px #FFFFFF"></span><span style="flex-grow: 1">{{t.n}}</span><span style="color: #B8372B; font-weight: 800; font-size: 12px">Ish</span><span style="width: 100px; text-align: right; color: #56607A">{{t.p}}</span><span style="width: 80px; text-align: right; color: #56607A">{{t.d}}</span></div>
</sc-for>
</div>
</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 220px 200px 1fr 150px 120px 90px; align-items: center; gap: 16px; padding: 15px 22px; border-radius: 20px; background: #E4E8EF; box-shadow: 6px 6px 12px #C2C8D2, -6px -6px 12px #FFFFFF; font-size: 14px; font-weight: 600">
<span style="font-weight: 800; font-size: 15px">{{d.day}}</span>
<div style="height: 12px; padding: 2px; box-sizing: border-box; border-radius: 8px; box-shadow: inset 2px 2px 4px #C2C8D2, inset -2px -2px 4px #FFFFFF"><div style="width: {{d.pct}}%; height: 100%; border-radius: 6px; background: {{accent}}"></div></div>
<span><b>{{d.p}}</b> pomodoro</span><span>Fokus <b>{{d.f}}</b></span><span style="color: #56607A">Tanaffus {{d.t}}</span><span style="color: #56607A">{{d.v}} vazifa</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8594C&quot;,&quot;options&quot;:[&quot;#E8594C&quot;,&quot;#5B7CF0&quot;,&quot;#2FA37A&quot;,&quot;#E0A030&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}">
class Component extends DCLogic {
renderVals() {
var raw = [['24-sentabr, Payshanba',12,'5s','30d','1/4'],['23-sentabr, Chorshanba',12,'5s 8d','1s 23d','5/5'],['22-sentabr, Seshanba',10,'6s 24d','2s 36d','4/6'],['20-sentabr, Yakshanba',13,'5s 48d','1s 18d','2/4'],['18-sentabr, Juma',13,'5s 25d','2s 2d','5/5'],['17-sentabr, Payshanba',12,'5s 25d','1s 15d','6/6'],['16-sentabr, Chorshanba',9,'3s 56d','1s 14d','4/4']];
return {
accent: this.props.accent ?? '#E8594C',
sub: [{ n: 'MI/IM analitika', p: '4/4 pomodoro', d: '1s 40d' }, { n: '2-son BMSM guruh kiritish', p: '4/4 pomodoro', d: '1s 40d' }, { n: 'Texnik qo‘llab-quvvatlash', p: '3/3 pomodoro', d: '1s 15d' }],
days: raw.map(function (r) { return { day: r[0], p: r[1], pct: Math.round(r[1] / 15 * 100), f: r[2], t: r[3], v: r[4] }; })
};
}
}
</script>


</body></html>
