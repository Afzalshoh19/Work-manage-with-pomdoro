<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<title>Kirish — Claymorphism</title>
<script src="de1a9f50-6add-4f80-b85d-ff5fc9a456c3"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>/* shriftlar olib tashlandi */</style>
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#F4EEE6;color:#3A2E4A}
a{color:#C2413A}a:hover{color:#8F2A25}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F4EEE6; display: flex; align-items: center; justify-content: space-between; padding: 0 120px; overflow: hidden">
<div style="width: 560px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 48px; height: 48px; border-radius: 18px; background: {{accent}}; box-shadow: 4px 6px 12px rgba(230,90,80,0.35), inset -3px -4px 6px rgba(0,0,0,0.12), inset 3px 3px 6px rgba(255,255,255,0.55)"></div><div style="font-weight: 900; font-size: 22px">Pomodoro</div></div>
<h1 style="margin: 0; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -0.03em">Ish vaqtingizni boshqaring</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; font-weight: 600; color: #5E5070">Kun tartibini tuzing, har bir vazifaga ketadigan vaqtni pomodoro usulida rejalashtiring va tanaffuslarni tizim o'zi hisoblasin.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{feats}}" as="f" hint-placeholder-count="4">
<div style="{{f.card}}"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{f.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{f.icon}}"></path></svg><div><div style="font-weight: 900; font-size: 15px">{{f.t}}</div><div style="font-size: 13px; font-weight: 700; color: {{f.ink}}">{{f.d}}</div></div></div>
</sc-for>
</div>
</div>
<form style="width: 470px; display: flex; flex-direction: column; gap: 18px; padding: 34px; box-sizing: border-box; border-radius: 44px; background: #FFFAF4; box-shadow: 20px 26px 50px rgba(140,110,80,0.25), inset -8px -10px 18px rgba(180,150,120,0.16), inset 8px 8px 16px #fff">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 6px; border-radius: 24px; background: #F1E8DE; box-shadow: inset 4px 4px 8px rgba(160,120,90,0.2), inset -4px -4px 8px #fff">
<button type="button" style="height: 46px; border: 0; border-radius: 18px; background: {{accent}}; color: #fff; font-weight: 900; font-size: 15px; box-shadow: 3px 5px 10px rgba(230,90,80,0.3), inset -2px -3px 5px rgba(0,0,0,0.12), inset 2px 2px 4px rgba(255,255,255,0.5)">Kirish</button>
<button type="button" style="height: 46px; border: 0; border-radius: 18px; background: transparent; color: #6B5C7A; font-weight: 800; font-size: 15px">Ro'yxatdan o'tish</button>
</div>
<button type="button" style="height: 54px; border: 0; border-radius: 22px; background: #FFFFFF; color: #3A2E4A; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 5px 7px 14px rgba(140,110,80,0.18), inset -3px -4px 6px rgba(0,0,0,0.04)"><span style="width: 22px; height: 22px; border-radius: 50%; background: #DCE8FF; color: #2E5BC9; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center">G</span>Google bilan davom etish</button>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 800; color: #9A8CA8"><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #F1E8DE"></span>yoki<span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #F1E8DE"></span></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 800">Email<input value="ism@kompaniya.uz" style="height: 54px; padding: 0 18px; border: 0; border-radius: 20px; background: #F6EFE6; color: #3A2E4A; font-size: 15px; font-weight: 700; box-shadow: inset 4px 4px 8px rgba(160,120,90,0.2), inset -4px -4px 8px #fff"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 800">Parol<input type="password" value="••••••••••••" style="height: 54px; padding: 0 18px; border: 0; border-radius: 20px; background: #F6EFE6; color: #3A2E4A; font-size: 15px; box-shadow: inset 4px 4px 8px rgba(160,120,90,0.2), inset -4px -4px 8px #fff"></label>
<a href="#" style="align-self: flex-end; font-size: 14px; font-weight: 800">Parolni unutdingizmi?</a>
<button type="submit" style="height: 58px; border: 0; border-radius: 22px; background: #3A2E4A; color: #fff; font-weight: 900; font-size: 17px; box-shadow: 6px 10px 20px rgba(58,46,74,0.35), inset -4px -5px 8px rgba(0,0,0,0.3), inset 4px 4px 8px rgba(255,255,255,0.18)">Kirish</button>
<div style="text-align: center; font-size: 13px; font-weight: 700; color: #7A6A88">Ma'lumotlaringiz shu kompyuterdagi serverda saqlanadi.</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F26B5E&quot;,&quot;options&quot;:[&quot;#F26B5E&quot;,&quot;#9C86F2&quot;,&quot;#57C08E&quot;,&quot;#F2B84B&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
renderVals() {
var tints = [['#FFD9D2','#8A3C35'],['#CDEFE0','#1F6B4B'],['#E4DBFF','#4F3AA0'],['#FFEDB8','#7A5A10']];
var raw = [
['M4 6h16v14H4zM4 10h16M8 3v4M16 3v4','Aqlli jadval','Avtomatik quriladi'],
['M5 20V10M12 20V4M19 20v-7','Statistika','HTML, MD, CSV, JSON'],
['M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1','Integratsiyalar','Jira, Notion, Confluence'],
['M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5z','Ma‘lumot sizda','O‘z serveringizda']
];
return {
accent: this.props.accent ?? '#F26B5E',
feats: raw.map(function (r, i) { var t = tints[i]; return { icon: r[0], t: r[1], d: r[2], ink: t[1], card: 'display:flex;gap:12px;align-items:center;padding:16px;border-radius:24px;background:' + t[0] + ';box-shadow:6px 9px 18px rgba(140,110,80,0.16),inset -4px -5px 8px rgba(0,0,0,0.06),inset 4px 4px 8px rgba(255,255,255,0.8)' }; })
};
}
}
</script>


</body></html>
