<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<title>Tarix — Glassmorphism</title>
<script src="30d1e936-1378-44e3-bb10-c931177fc28d"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>/* shriftlar olib tashlandi */</style>
<style>
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:#0B0E1A;color:#F4F6FF}
a{color:#FFB4A8}a:hover{color:#FFD2CB}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; position: relative; overflow: hidden; background: #0B0E1A">
<div style="position: absolute; width: 600px; height: 600px; left: -120px; top: -100px; border-radius: 50%; background: {{accent}}; filter: blur(160px); opacity: 0.4"></div>
<div style="position: absolute; width: 600px; height: 600px; left: 1000px; top: 500px; border-radius: 50%; background: #7B5CFF; filter: blur(160px); opacity: 0.45"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 24px; padding: 24px 40px 40px; box-sizing: border-box; height: 100%">
<header style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 12px 0 20px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 22px; backdrop-filter: blur(24px)">
<div style="font-family: Sora, sans-serif; font-weight: 700; font-size: 18px">Pomodoro</div>
<nav style="display: flex; gap: 4px; padding: 4px; background: rgba(255,255,255,0.06); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1)">
<a href="Main.dc.html" style="padding: 10px 20px; border-radius: 12px; color: rgba(244,246,255,0.75); font-weight: 600; font-size: 14px; text-decoration: none">Bugun</a>
<a href="Stat-Glass.dc.html" style="padding: 10px 20px; border-radius: 12px; color: rgba(244,246,255,0.75); font-weight: 600; font-size: 14px; text-decoration: none">Statistika</a>
<a href="Rep-Glass.dc.html" style="padding: 10px 20px; border-radius: 12px; color: rgba(244,246,255,0.75); font-weight: 600; font-size: 14px; text-decoration: none">Hisobot</a>
<a href="#" style="padding: 10px 20px; border-radius: 12px; background: rgba(255,255,255,0.9); color: #0B0E1A; font-weight: 700; font-size: 14px; text-decoration: none">Tarix</a>
</nav>
<div style="font-size: 14px; font-weight: 600">Foydalanuvchi I.</div>
</header>

<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; align-items: flex-end; gap: 20px">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 34px; font-weight: 700">Tarix</h1>
<div style="display: flex; gap: 8px">
<button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F4F6FF; font-weight: 600; font-size: 13px">↓ JSON</button>
<button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F4F6FF; font-weight: 600; font-size: 13px">↓ CSV (Excel)</button>
<button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F4F6FF; font-weight: 600; font-size: 13px">↑ Import</button>
</div>
</div>
<div style="display: flex; gap: 10px; align-items: center">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(244,246,255,0.7)">Dan<input value="28.08.2026" style="height: 44px; width: 130px; padding: 0 14px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #F4F6FF; font-size: 14px"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(244,246,255,0.7)">Gacha<input value="26.09.2026" style="height: 44px; width: 130px; padding: 0 14px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #F4F6FF; font-size: 14px"></label>
<button style="height: 44px; padding: 0 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.3); background: linear-gradient(135deg, {{accent}}, #FF8F6B); color: #fff; font-weight: 700; font-size: 14px">Ko'rish</button>
</div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 28px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(28px)">
<div style="padding: 16px 20px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,140,120,0.45)">
<div style="display: grid; grid-template-columns: 220px 200px 1fr 140px 120px 90px; align-items: center; gap: 16px; font-size: 14px">
<b style="font-size: 15px">25-sentabr, Juma</b>
<div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1)"><div style="width: 73%; height: 100%; border-radius: 4px; background: {{accent}}"></div></div>
<span><b>11</b> pomodoro</span><span>Fokus <b>4s 35d</b></span><span style="color: rgba(244,246,255,0.7)">Tanaffus 5d</span><span style="color: rgba(244,246,255,0.7)">0/3 vazifa</span>
</div>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{sub}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,0.05); font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4)"></span><span style="flex-grow: 1">{{t.n}}</span><span style="padding: 2px 10px; border-radius: 999px; background: rgba(255,107,91,0.2); color: #FFB4A8; font-size: 12px; font-weight: 700">Ish</span><span style="width: 100px; text-align: right; color: rgba(244,246,255,0.7)">{{t.p}}</span><span style="width: 90px; text-align: right; color: rgba(244,246,255,0.7)">{{t.d}}</span></div>
</sc-for>
</div>
</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 220px 200px 1fr 140px 120px 90px; align-items: center; gap: 16px; padding: 15px 20px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); font-size: 14px">
<b style="font-size: 15px">{{d.day}}</b>
<div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1)"><div style="width: {{d.pct}}%; height: 100%; border-radius: 4px; background: {{accent}}"></div></div>
<span><b>{{d.p}}</b> pomodoro</span><span>Fokus <b>{{d.f}}</b></span><span style="color: rgba(244,246,255,0.7)">Tanaffus {{d.t}}</span><span style="color: rgba(244,246,255,0.7)">{{d.v}} vazifa</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF6B5B&quot;,&quot;options&quot;:[&quot;#FF6B5B&quot;,&quot;#7B5CFF&quot;,&quot;#1FC7B6&quot;,&quot;#FFB020&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}">
class Component extends DCLogic {
renderVals() {
var raw = [['24-sentabr, Payshanba',12,'5s','30d','1/4'],['23-sentabr, Chorshanba',12,'5s 8d','1s 23d','5/5'],['22-sentabr, Seshanba',10,'6s 24d','2s 36d','4/6'],['20-sentabr, Yakshanba',13,'5s 48d','1s 18d','2/4'],['18-sentabr, Juma',13,'5s 25d','2s 2d','5/5'],['17-sentabr, Payshanba',12,'5s 25d','1s 15d','6/6'],['16-sentabr, Chorshanba',9,'3s 56d','1s 14d','4/4']];
return {
accent: this.props.accent ?? '#FF6B5B',
sub: [{ n: 'MI/IM analitika', p: '4/4 pomodoro', d: '1s 40d' }, { n: '2-son BMSM guruh kiritish', p: '4/4 pomodoro', d: '1s 40d' }, { n: 'Texnik qo‘llab-quvvatlash', p: '3/3 pomodoro', d: '1s 15d' }],
days: raw.map(function (r) { return { day: r[0], p: r[1], pct: Math.round(r[1] / 15 * 100), f: r[2], t: r[3], v: r[4] }; })
};
}
}
</script>


</body></html>
