<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<title>Statistika — Skeuomorphism</title>
<script src="527a22c1-c414-420f-b2f6-e0cee3481494"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>/* shriftlar olib tashlandi */</style>
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#2B1D15;color:#2A2420}
a{color:#F3E6CF}a:hover{color:#fff}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 1240px; box-sizing: border-box; overflow: hidden; background: repeating-linear-gradient(92deg, #4A3224 0px, #553A2A 6px, #4A3224 11px, #3F2A1E 18px, #4A3224 26px); display: flex; flex-direction: column; gap: 24px; padding: 24px 40px 40px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 68px; padding: 0 16px 0 20px; border-radius: 14px; background: linear-gradient(180deg, #2E2A27, #1C1A18); border: 1px solid #0D0C0B; box-shadow: 0 8px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12); outline: 1px dashed rgba(243,230,207,0.3); outline-offset: -7px">
<div style="font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 20px; color: #F3E6CF">Pomodoro</div>
<nav style="display: flex; border-radius: 10px; background: #111; padding: 3px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8)">
<a href="Skeuo.dc.html" style="padding: 10px 22px; color: #D9CCB4; font-weight: 600; font-size: 14px; text-decoration: none">Bugun</a>
<a href="#" style="padding: 10px 22px; border-radius: 8px; background: linear-gradient(180deg, #F4EDE0, #CFC4AE); color: #2A2420; font-weight: 700; font-size: 14px; text-decoration: none; box-shadow: inset 0 1px 0 #fff">Statistika</a>
<a href="Rep-Skeuo.dc.html" style="padding: 10px 22px; color: #D9CCB4; font-weight: 600; font-size: 14px; text-decoration: none">Hisobot</a>
<a href="Hist-Skeuo.dc.html" style="padding: 10px 22px; color: #D9CCB4; font-weight: 600; font-size: 14px; text-decoration: none">Tarix</a>
</nav>
<div style="font-weight: 600; font-size: 14px; color: #F3E6CF">Foydalanuvchi I.</div>
</header>

<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="color: #F3E6CF"><div style="font-size: 14px; color: #D9CCB4">20–26-sentabr</div><h1 style="margin: 4px 0 0; font-family: 'Libre Baskerville', serif; font-size: 32px; text-shadow: 0 2px 3px rgba(0,0,0,0.6)">Statistika</h1></div>
<div style="display: flex; border-radius: 10px; background: #111; padding: 3px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.15)">
<button style="padding: 10px 18px; border: 1px solid #6E1A10; border-radius: 8px; background: linear-gradient(180deg, #FF8C78, {{accent}} 50%, #C23B2B); color: #fff; font-weight: 700; font-size: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)">7 kun</button>
<button style="padding: 10px 18px; border: 0; background: transparent; color: #D9CCB4; font-weight: 600; font-size: 14px">30 kun</button>
<button style="padding: 10px 18px; border: 0; background: transparent; color: #D9CCB4; font-weight: 600; font-size: 14px">90 kun</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="8">
<div style="padding: 14px; border-radius: 12px; background: linear-gradient(180deg, #E9E9E6 0%, #C9CAC6 48%, #B8B9B4 52%, #D6D7D3 100%); border: 1px solid #7C7D78; box-shadow: 0 8px 14px rgba(0,0,0,0.45), inset 0 1px 0 #fff">
<div style="font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: #45463F; text-transform: uppercase; text-shadow: 0 1px 0 rgba(255,255,255,0.8)">{{k.label}}</div>
<div style="margin-top: 8px; padding: 8px 12px; border-radius: 6px; background: #1A1A18; box-shadow: inset 0 2px 5px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.7); display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Share Tech Mono', monospace; font-size: 30px; color: #FFB85C; text-shadow: 0 0 8px rgba(255,170,60,0.5)">{{k.value}}</span><span style="font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #C9A36A">{{k.sub}}</span></div>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
<div style="grid-column: span 2; border-radius: 4px; background: #FBF7EE; background-image: linear-gradient(rgba(90,140,200,0.18) 1px, transparent 1px), linear-gradient(90deg, rgba(90,140,200,0.18) 1px, transparent 1px); background-size: 24px 24px; box-shadow: 0 18px 32px rgba(0,0,0,0.5); padding: 24px 28px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-family: Caveat, cursive; font-size: 32px; font-weight: 700; color: #2A2A6E">Kunlik pomodorolar</div><div style="font-family: Caveat, cursive; font-size: 22px; color: #B63A2C">— — maqsad 8</div></div>
<div style="position: relative; flex-grow: 1; margin-top: 12px; display: flex; align-items: flex-end; justify-content: space-around; border-bottom: 2px solid #2A2420">
<div style="position: absolute; left: 0; right: 0; bottom: 123px; border-top: 2px dashed #B63A2C"></div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 90px">
<div style="font-family: Caveat, cursive; font-size: 24px; font-weight: 700; color: #2A2A6E">{{d.v}}</div>
<div style="width: 40px; height: {{d.h}}px; background: repeating-linear-gradient(135deg, {{accent}} 0 6px, #C94432 6px 9px); border: 2px solid #2A2420; border-bottom: 0; box-sizing: border-box"></div>
</div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-around; margin-top: 8px"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><div style="width: 90px; text-align: center; font-family: Caveat, cursive; font-size: 20px; color: #5E554A">{{d.l}}</div></sc-for></div>
</div>
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="padding: 20px; border-radius: 14px; background: linear-gradient(180deg, #2E2A27, #1C1A18); border: 1px solid #0D0C0B; box-shadow: 0 14px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12); color: #F3E6CF">
<div style="font-family: 'Libre Baskerville', serif; font-size: 17px; font-weight: 700">Eng samarali soatlar</div>
<div style="margin-top: 14px; padding: 14px 12px 8px; border-radius: 8px; background: linear-gradient(180deg, #1B2A1E, #0F1A12); box-shadow: inset 0 4px 12px rgba(0,0,0,0.9)">
<div style="height: 130px; display: flex; align-items: flex-end; gap: 5px"><sc-for list="{{hours}}" as="h" hint-placeholder-count="12"><div style="flex-grow: 1; height: {{h.h}}px; background: repeating-linear-gradient(0deg, {{h.c}} 0 5px, transparent 5px 7px)"></div></sc-for></div>
<div style="display: flex; justify-content: space-between; margin-top: 6px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #6FCF7F"><span>08</span><span>11</span><span>14</span><span>17</span><span>19</span></div>
</div>
</div>
<div style="flex-grow: 1; border-radius: 4px; background: #FBF7EE; box-shadow: 0 18px 32px rgba(0,0,0,0.5); padding: 18px 22px; background-image: repeating-linear-gradient(180deg, transparent 0 35px, #C9D8EA 35px 36px)">
<div style="font-family: Caveat, cursive; font-size: 28px; font-weight: 700; color: #2A2A6E">Kategoriyalar</div>
<div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 6px"><b>Ish</b><span>53 pom · 24s 50d</span></div>
<div style="margin-top: 6px; height: 12px; border: 2px solid #2A2420"><div style="width: 91%; height: 100%; background: {{accent}}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 16px"><b>Boshqa</b><span>5 pom · 2s 5d</span></div>
<div style="margin-top: 6px; height: 12px; border: 2px solid #2A2420"><div style="width: 9%; height: 100%; background: #2F7DD1"></div></div>
<div style="margin-top: 18px; font-family: Caveat, cursive; font-size: 22px; color: #B63A2C">Top: 2-son BMSM (5 pom), Texnik yordam (5 pom)</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E5533F&quot;,&quot;options&quot;:[&quot;#E5533F&quot;,&quot;#2F7DD1&quot;,&quot;#2FAE3A&quot;,&quot;#D9982B&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1240}}">
class Component extends DCLogic {
renderVals() {
var dv = [['20.09',13],['21.09',0],['22.09',10],['23.09',12],['24.09',12],['25.09',11],['26.09',0]];
var hv = [1,3,5,5,5,1,10,5,3,2,2,1];
return {
accent: this.props.accent ?? '#E5533F',
kpis: [
{ label: 'Bugun', value: '00', sub: 'MAQSAD 8' },
{ label: 'Sof fokus', value: '0:00', sub: 'SOAT' },
{ label: 'Vazifalar', value: '0/0', sub: 'REJA 0%' },
{ label: 'Seriya', value: '04', sub: '16 FAOL KUN' },
{ label: '7 kunlik jami', value: '58', sub: '26:55' },
{ label: 'Kunlik o‘rtacha', value: '11.7', sub: 'REKORD 13' },
{ label: 'Umumiy fokus', value: '83.2', sub: '187 POM' },
{ label: 'Uzilishlar', value: '00', sub: 'BUGUN' }
],
days: dv.map(function (d) { return { l: d[0], v: d[1], h: Math.max(3, Math.round(d[1] / 13 * 200)) }; }),
hours: hv.map(function (v) { return { h: Math.max(4, v * 12), c: v === 10 ? '#FFB85C' : '#6FCF7F' }; })
};
}
}
</script>


</body></html>
